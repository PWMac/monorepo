# Oracle Edge concept map: which XBRL tags feed each normalized line item.
# Tags are tried in order PER FISCAL YEAR, so a company that switched tags over time
# (e.g. SalesRevenueNet -> RevenueFromContractWithCustomer...) still has a continuous history.
# kind: duration = flow over the fiscal year; instant = balance at fiscal year end.
# Improve coverage over time by adding tags here; the Data Doctor screen shows gaps.

revenue:
  kind: duration
  tags:
    - us-gaap:Revenues
    - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
    - us-gaap:SalesRevenueNet
    - us-gaap:SalesRevenueGoodsNet
    - us-gaap:SalesRevenueServicesNet
    - us-gaap:RevenuesNetOfInterestExpense
    - us-gaap:TotalRevenuesAndOtherIncome
    - ifrs-full:Revenue
    - ifrs-full:RevenueFromContractsWithCustomers
