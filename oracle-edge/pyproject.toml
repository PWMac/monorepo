[project]
name = "oracle-edge"
version = "0.11.2"
description = "Oracle Edge: a local, Oracle-style stock screener, ranker and signal tracker."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "nicegui>=3.17,<4",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "exchange-calendars>=4.5",
    "yfinance>=0.2.50",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
